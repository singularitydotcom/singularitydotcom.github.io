name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validator tests
        run: node --test tests/*.test.mjs
      - name: Profiles valid and index fresh
        if: github.event_name == 'push'
        run: node scripts/build-index.mjs --check || echo "::warning::index stale; reindex job will fix it"
      - name: Profile PR checks
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: node scripts/check-pr.mjs

  # After a profile PR is merged, regenerate data/*.json on main.
  reindex:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: registry-writes
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Rebuild index
        run: |
          node scripts/build-index.mjs
          if [ -n "$(git status --porcelain data)" ]; then
            git add data && git -c user.name="GSF Lab" -c user.email="lab@gsflab.invalid" commit -m "Reindex registry"
            git push origin HEAD:main
          fi
